name: Android Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest platform-tools platforms;android-35 build-tools;35.0.0 ndk;26.3.11579264'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run Debug Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Compress debug APK with zstd
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/spicyex-release.jks

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run debug gates before release packaging
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Build signed Release APKs
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spicyex-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify release APK signatures
        env:
          SIGNING_KEYSTORE_FILE: ${{ github.workspace }}/spicyex-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          expected=$(keytool -list -v \
            -keystore "$SIGNING_KEYSTORE_FILE" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')
          test -n "$expected"
          for apk in \
            app/build/outputs/apk/release/app-release.apk
          do
            actual=$(apksigner verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]')
            test "$actual" = "$expected"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spicy-ex-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
