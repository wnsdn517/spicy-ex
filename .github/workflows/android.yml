name: Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: r26c

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Full flavor)
        run: ./gradlew :app:assembleFullDebug --no-daemon

      - name: Build with Gradle (Lite flavor)
        run: ./gradlew :app:assembleLiteDebug --no-daemon

      - name: Run unit tests (Full)
        run: ./gradlew :app:testFullDebugUnitTest --no-daemon

      - name: Run unit tests (Lite)
        run: ./gradlew :app:testLiteDebugUnitTest --no-daemon

      - name: Upload APK artifacts (Full)
        uses: actions/upload-artifact@v4
        with:
          name: SpicyEX-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          retention-days: 7

      - name: Upload APK artifacts (Lite)
        uses: actions/upload-artifact@v4
        with:
          name: SpicyEX-lite-debug
          path: app/build/outputs/apk/lite/debug/*.apk
          retention-days: 7

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint (Full)
        run: ./gradlew :app:lintFullDebug --no-daemon

      - name: Run lint (Lite)
        run: ./gradlew :app:lintLiteDebug --no-daemon

      - name: Upload lint reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint/
          retention-days: 7

  release:
    needs: [build, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: r26c

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release (Full)
        run: ./gradlew :app:assembleFullRelease --no-daemon

      - name: Build Release (Lite)
        run: ./gradlew :app:assembleLiteRelease --no-daemon

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/lite/release/*.apk
          generate_release_notes: true