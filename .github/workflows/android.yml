name: Android Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.3.11579264'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Full Debug
        run: ./gradlew :app:assembleFullDebug --no-daemon

      - name: Build Lite Debug
        run: ./gradlew :app:assembleLiteDebug --no-daemon

      - name: Run Full Unit Tests
        run: ./gradlew :app:testFullDebugUnitTest --no-daemon

      - name: Run Lite Unit Tests
        run: ./gradlew :app:testLiteDebugUnitTest --no-daemon

      - name: Upload Full APK
        uses: actions/upload-artifact@v4
        with:
          name: SpicyEX-full-debug
          path: app/build/outputs/apk/full/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: SpicyEX-lite-debug
          path: app/build/outputs/apk/lite/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Full Lint
        run: ./gradlew :app:lintFullDebug --no-daemon

      - name: Run Lite Lint
        run: ./gradlew :app:lintLiteDebug --no-daemon

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint/
          retention-days: 7
          if-no-files-found: ignore

  release:
    needs:
      - build
      - lint

    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools ndk;26.3.11579264'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Full Release
        run: ./gradlew :app:assembleFullRelease --no-daemon

      - name: Build Lite Release
        run: ./gradlew :app:assembleLiteRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/full/release/*.apk
            app/build/outputs/apk/lite/release/*.apk
          generate_release_notes: true